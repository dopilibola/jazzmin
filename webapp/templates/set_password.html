{% extends "base.html" %}
{% block title %}Parol o'rnatish — Maskan{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Parol o'rnating</h1>
  <p class="muted">Parol kamida 6 ta raqamdan iborat bo'lsin. Keyingi safar shu parol bilan kirasiz.</p>
  {% for e in errors or [] %}<div class="flash flash-error">{{ e }}</div>{% endfor %}
  <form method="post" action="/set-password">
    <label>Yangi parol (kamida 6 raqam)</label>
    <input type="password" name="password" inputmode="numeric" minlength="6" required>
    <label>Parolni takrorlang</label>
    <input type="password" name="password2" inputmode="numeric" minlength="6" required>
    <button type="submit" class="btn full">Saqlash va kirish</button>
  </form>
</div>
{% endblock %}
