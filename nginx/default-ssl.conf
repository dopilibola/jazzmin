server {
    listen 80;
    server_name mas-kan.uz www.mas-kan.uz;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mas-kan.uz www.mas-kan.uz;

    ssl_certificate /etc/letsencrypt/live/mas-kan.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mas-kan.uz/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8008;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location /static/ {
        alias /home/marketing_ttlk_co_uk/jazzmin/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /home/marketing_ttlk_co_uk/jazzmin/media/;
        expires 7d;
        access_log off;
    }
}
